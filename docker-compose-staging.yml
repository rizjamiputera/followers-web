# services / containers
services:
    # express app
    stg-web-followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: stg-web-followers
        # image: web-followers-dev:latest
        # image: ${IMAGE_TAG:-web-followers-dev:latest}
        image: web-followers-staging:latest
        restart: always
        ports:
            - 3777:3000
        environment:
            NUXT_PUBLIC_WEB_URI: https://stg.followersbicara.com
            NUXT_PUBLIC_API_URI: https://stg-api.followersbicara.com

name: Deploy to VPS

on:
    push:
        branches:
            - dev # run only when pushing to dev

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Deploy via SSH
              run: |
                  ssh -o StrictHostKeyChecking=no deploy@${{ secrets.VPS_HOST }} "
                    git config --global --add safe.directory /opt/followers/followers-web
                    cd /opt/followers/followers-web && \
                    git pull origin dev && \
                    docker-compose build --no-cache && \
                    docker-compose down && \
                    docker-compose up -d
                  "

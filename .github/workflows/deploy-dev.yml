name: Deploy to Dev

on:
    push:
        branches:
            - dev # run only when pushing to dev

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Deploy via SSH
              run: |
                  ssh -o StrictHostKeyChecking=no deploy@${{ secrets.VPS_HOST }} "
                    cd /opt/followers/followers-web && \
                    git config --global --add safe.directory /opt/followers/followers-web && \
                    git fetch origin && \
                    git checkout dev && \
                    git reset --hard origin/dev && \
                    IMAGE_TAG=web-followers-dev:${GITHUB_SHA::8} && \
                    docker compose build --build-arg IMAGE_TAG=$IMAGE_TAG && \
                    docker compose down && \
                    docker compose up -d
                  "

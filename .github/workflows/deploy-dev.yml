name: Deploy to Dev

on:
    push:
        branches:
            - dev # run only when pushing to dev

jobs:
    deploy:
        runs-on: ubuntu-latest
        # Workflow disabled - remove this condition to re-enable
        if: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Deploy via SSH
              run: |
                  ssh -o StrictHostKeyChecking=no deploy@${{ secrets.VPS_HOST }} "
                    cd /opt/followers/followers-web && \
                    git config --global --add safe.directory /opt/followers/followers-web && \

                    git fetch origin --tags && \
                    git checkout dev && \

                    git reset --hard origin/dev && \

                    # Extract version from package.json using grep and sed
                    VERSION=\$(grep -o '\"version\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' package.json | sed 's/.*\"\([^\"]*\)\"/\1/') && \
                    COMMIT_HASH=\$(git rev-parse HEAD | cut -c1-7) && \
                    IMAGE_TAG=web-followers-dev:\$VERSION-dev-\$COMMIT_HASH && \

                    echo Building image = \$IMAGE_TAG && \

                    docker compose build --no-cache && \
                    docker tag web-followers-dev:latest \$IMAGE_TAG && \
                    docker compose down && \
                    docker compose up -d && \

                    docker image prune -f --filter \"until=168h\"
                  "

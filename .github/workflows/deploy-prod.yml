name: Deploy Production

on:
    push:
        tags:
            - 'v*'

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    verify:
        name: Build verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    build-and-push:
        name: Build & Push Web image
        runs-on: ubuntu-latest
        needs: [verify]
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.img.outputs.full }}
        steps:
            - uses: actions/checkout@v4

            - name: Compute image path
              id: img
              run: |
                  REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  echo "name=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
                  echo "full=ghcr.io/${REPO}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.img.outputs.name }}:${{ github.ref_name }}
                      ${{ steps.img.outputs.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to VPS (Production)
        runs-on: ubuntu-latest
        needs: [build-and-push]

        steps:
            - name: Extract tag
              id: tag
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  command_timeout: 30m
                  script: |
                      set -e
                      TAG="${{ steps.tag.outputs.tag }}"
                      PROJECT_DIR="${{ secrets.PROJECT_DIR || '/opt/followers/followers-web' }}"
                      PROJECT_DIR="$(eval echo "$PROJECT_DIR")"
                      cd "$PROJECT_DIR"

                      echo "==> Deploying production tag: $TAG"

                      git fetch --tags --force origin
                      git checkout "$TAG"

                      # ── Pre-flight: require .env.production ──
                      if [ ! -f .env.production ]; then
                          echo "ERROR: $PROJECT_DIR/.env.production is missing."
                          echo "Hint: copy .env.production.example and fill in real values."
                          exit 1
                      fi
                      for key in NUXT_PUBLIC_WEB_URI NUXT_PUBLIC_API_URI; do
                          if ! grep -qE "^${key}=.+" .env.production; then
                              echo "ERROR: .env.production missing or empty: $key"
                              exit 1
                          fi
                      done

                      echo "==> Pulling Web image ghcr.io/${{ github.repository }}:${TAG}..."
                      export WEB_IMAGE_TAG="$TAG"
                      docker compose -f docker-compose-production.yml pull web-followers
                      docker compose -f docker-compose-production.yml up -d web-followers

                      echo "==> Waiting for Web container..."
                      sleep 10
                      docker ps --filter 'name=web-followers' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

                      docker image prune -f --filter "until=168h"
                      echo "==> Production deploy $TAG complete!"

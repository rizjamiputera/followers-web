name: Deploy to Production

on:
    push:
        branches:
            - stg # run only when pushing to stg

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Deploy via SSH
              run: |
                  ssh -o StrictHostKeyChecking=no deploy@${{ secrets.VPS_HOST }} "
                    cd /opt/followers/followers-web && \
                    git config --global --add safe.directory /opt/followers/followers-web && \

                    git fetch origin --tags && \
                    git checkout stg && \

                    git reset --hard origin/stg && \

                    # Extract version from package.json using grep and sed
                    VERSION=\$(grep -o '\"version\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' package.json | sed 's/.*\"\([^\"]*\)\"/\1/') && \
                    IMAGE_TAG=web-followers-staging:\$VERSION && \

                    echo Building image = \$IMAGE_TAG && \

                    docker compose -f docker-compose-staging.yml build --no-cache && \
                    docker tag web-followers-staging:latest \$IMAGE_TAG && \
                    docker compose -f docker-compose-staging.yml down && \
                    docker compose -f docker-compose-staging.yml up -d && \

                    docker image prune -f --filter \"until=168h\"
                  "

# services / containers
services:
    # express app
    dev-web-followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev-web-followers
        image: web-followers-dev:0.0.7-3
        restart: always
        ports:
            - 3111:3000
        environment:
            NUXT_PUBLIC_WEB_URI: https://dev.followersbicara.com
            NUXT_PUBLIC_API_URI: https://dev-api.followersbicara.com

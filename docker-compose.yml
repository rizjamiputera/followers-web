# services / containers
services:
    # express app
    dev-web-followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev-web-followers
        # image: web-followers-dev:latest
        image: ${IMAGE_TAG:-web-followers-dev:latest}
        # image: web-followers-dev:${IMAGE_TAG}
        restart: always
        ports:
            - 3111:3000
        environment:
            NUXT_PUBLIC_WEB_URI: https://dev.followersbicara.com
            NUXT_PUBLIC_API_URI: https://dev-api.followersbicara.com

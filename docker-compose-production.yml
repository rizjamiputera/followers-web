# services / containers
services:
    # express app
    web-followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: web-followers
        # image: followers-dev:1.2.0-2
        image: ${IMAGE_TAG:-web-followers-main:latest}
        restart: always
        ports:
            - 3333:3000
        environment:
            NUXT_PUBLIC_WEB_URI: https://followersbicara.com
            NUXT_PUBLIC_API_URI: https://api.followersbicara.com

# services / containers
services:
    # express app
    web-followers:
        image: ghcr.io/putera-/followers-web:${WEB_IMAGE_TAG:-latest}
        container_name: web-followers
        pull_policy: always
        restart: always
        ports:
            - 3333:3000
        environment:
            NUXT_PUBLIC_WEB_URI: https://followersbicara.com
            NUXT_PUBLIC_API_URI: https://api.followersbicara.com

# services / containers
#
# Runtime env lives in .env.production on the VPS (gitignored).
# See .env.production.example for required keys.
services:
    web-followers:
        image: ghcr.io/rizjamiputera/followers-web:${WEB_IMAGE_TAG:-latest}
        container_name: web-followers
        pull_policy: always
        restart: always
        env_file: .env.production
        ports:
            - 3333:3000
